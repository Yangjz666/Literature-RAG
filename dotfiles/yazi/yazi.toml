[manager]
show_hidden = true
show_symlink = true
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
linemode = "size"

[preview]
tab_size = 2
max_width = 1200
max_height = 1800
cache_dir = ""
image_filter = "triangle"
image_quality = 75
sixel_fraction = 15

[opener]
edit = [
  { run = 'nvim "$@"', block = true, for = "unix" },
  { run = 'nvim "%*"', block = true, for = "windows" }
]
open = [
  { run = 'start "" "%1"', orphan = true, for = "windows" },
  { run = 'xdg-open "$1"', orphan = true, for = "linux" },
  { run = 'open "$1"', orphan = true, for = "macos" }
]
reveal = [
  { run = 'explorer /select,"%1"', orphan = true, for = "windows" }
]
extract = [
  { run = 'ya pub extract --list "$@"', desc = "Extract here", for = "unix" },
  { run = 'ya pub extract --list "%*"', desc = "Extract here", for = "windows" }
]
play = [
  { run = 'ffplay -autoexit "$@"', orphan = true, for = "unix" },
  { run = 'ffplay -autoexit "%*"', orphan = true, for = "windows" }
]

[open]
rules = [
  { name = "*/", use = [ "edit", "open", "reveal" ] },
  { mime = "text/*", use = [ "edit", "open", "reveal" ] },
  { mime = "application/json", use = [ "edit", "open", "reveal" ] },
  { mime = "application/javascript", use = [ "edit", "open", "reveal" ] },
  { mime = "inode/empty", use = [ "edit", "open", "reveal" ] },
  { mime = "image/*", use = [ "open", "reveal" ] },
  { mime = "video/*", use = [ "play", "open", "reveal" ] },
  { mime = "audio/*", use = [ "play", "open", "reveal" ] },
  { mime = "application/pdf", use = [ "open", "reveal" ] },
  { mime = "application/zip", use = [ "extract", "reveal" ] },
  { mime = "application/gzip", use = [ "extract", "reveal" ] },
  { mime = "application/x-tar", use = [ "extract", "reveal" ] },
  { mime = "*", use = [ "open", "reveal" ] }
]
